<!doctype html><html><head><meta charset="utf-8"><title>Feature sheet</title>
<style>body{background:#151a22;margin:0;padding:8px;font:10px monospace;color:#cfd6e2}canvas{image-rendering:pixelated}</style>
</head><body><canvas id="c" width="1180" height="900"></canvas>
<script src="../src/palette.js"></script><script src="../src/sprites.js"></script>
<script src="../src/charedit.js"></script><script src="../src/roster.js"></script>
<script>
var ctx=document.getElementById('c').getContext('2d');ctx.imageSmoothingEnabled=false;
var Z=4,S=24,PAD=8;
function base(extra){
  var d={id:'x',name:'X',skin:'tan',build:'normal',face:'square',hair:'brown',hairStyle:'buzz',
         shirt:'#4a5a7c',sleeves:'long',pants:'#2b3340',shoes:'#181c24',brows:'thin'};
  for(var k in extra) d[k]=extra[k];
  return d;
}
var y=14;
function band(title, items, facings){
  ctx.fillStyle='#f5b942';ctx.font='11px monospace';ctx.fillText(title,6,y);
  y+=6;
  items.forEach(function(it,i){
    var a=PW.bake(it.def,{cuffed:false});
    (facings||['front']).forEach(function(f,k){
      ctx.drawImage(a[f], 6+i*((facings||['front']).length*(S*Z)+PAD+14)+k*S*Z, y, S*Z, S*Z);
    });
    ctx.fillStyle='#9aa4b4';ctx.font='9px monospace';
    ctx.fillText(it.label, 6+i*((facings||['front']).length*(S*Z)+PAD+14), y+S*Z+10);
  });
  y+=S*Z+22;
}
band('HAIR (front / side)', ['swoop','pomp','afro','curls','bun','long'].map(function(h){
  return {label:h, def:base({hairStyle:h})};}), ['front','side']);
band('FACE', PW.CHAR.FACES.map(function(f){return {label:f, def:base({face:f})};}));
band('BROWS', PW.CHAR.BROWS.map(function(b){return {label:b, def:base({brows:b})};}));
band('MAKEUP', PW.CHAR.MAKEUP.map(function(m){
  return {label:m, def:base({makeup:m,makeupColor:'#a05a8a',makeupColor2:'#3a2030'})};}));
band('GLASSES', PW.CHAR.GLASSES.map(function(g){return {label:g, def:base({glasses:g})};}));
band('GRAPHIC', PW.CHAR.GRAPHICS.slice(1).map(function(g){
  return {label:g, def:base({graphic:g,graphicColor:'#f2f4f8'})};}));
</script></body></html>
